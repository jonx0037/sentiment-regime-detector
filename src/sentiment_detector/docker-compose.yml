version: '3.8'

# =============================================================================
# Docker Compose Configuration for Sentiment Regime Detector
# =============================================================================
# Usage:
#   - Infrastructure only (db + redis):    docker compose up
#   - With API service:                     docker compose --profile api up
#   - Full stack:                           docker compose --profile all up
#
# Profiles:
#   - (default): PostgreSQL + Redis only (for local API development)
#   - api: Adds the FastAPI backend service
#   - all: Same as api (includes everything)
# =============================================================================

services:
  # ==========================================================================
  # PostgreSQL Database (always runs)
  # ==========================================================================
  db:
    image: postgres:15-alpine
    container_name: sentiment-db
    environment:
      POSTGRES_DB: sentiment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sentiment-network
    restart: unless-stopped

  # ==========================================================================
  # Redis Cache (always runs)
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: sentiment-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sentiment-network
    restart: unless-stopped

  # ==========================================================================
  # Backend API (optional, enabled with --profile api or --profile all)
  # ==========================================================================
  api:
    profiles: ["api", "all"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: sentiment-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db:5432/sentiment_db
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - API_RELOAD=true
    env_file:
      - .env
    volumes:
      # Mount source code for hot reloading
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sentiment-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  sentiment-network:
    driver: bridge
