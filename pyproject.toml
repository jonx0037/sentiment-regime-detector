[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentiment-regime-detector"
version = "0.1.0"
description = "Cross-Asset Sentiment Regime Detector: Automating Market Psychology Analysis Through Multi-Source NLP"
# readme = "README.md"  # Optional - disabled for deployment
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
authors = [
    { name = "Jonathan Rocha", email = "jrocha@smu.edu" }
]
keywords = ["sentiment-analysis", "nlp", "finance", "market-regime", "transformers"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Web Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Database
    "sqlalchemy>=2.0.25",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",

    # ML/NLP - Core
    "transformers>=4.37.0",
    "torch>=2.1.0",
    "datasets>=2.16.0",
    "sentence-transformers>=2.2.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",

    # ML/NLP - Financial Domain
    "finbert-embedding>=0.1.4",

    # ML/NLP - Traditional Tools
    "nltk>=3.8.0",
    "spacy>=3.6.0",
    "textblob>=0.17.0",
    "vaderSentiment>=3.3.2",

    # Data Collection - Social Media & News
    "praw>=7.7.0",           # Reddit
    "tweepy>=4.14.0",         # Twitter/X
    "newsapi-python>=0.2.7",  # News aggregation
    "httpx>=0.26.0",          # Async HTTP
    "aiohttp>=3.9.0",         # Async HTTP alternative
    "beautifulsoup4>=4.12.0", # Web scraping

    # Data Collection - Financial Markets
    "yfinance>=0.2.35",
    "pandas-datareader>=0.10.0",

    # Data Processing & Analysis
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "statsmodels>=0.14.0",  # Time series analysis

    # Utilities
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "tenacity>=8.2.0",
    "tqdm>=4.65.0",         # Progress bars
    "joblib>=1.3.0",        # Parallel processing
    "jsonschema>=4.18.0",   # Data validation
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]
notebook = [
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.18.0",
]
hpc = [
    # Additional packages for MANEFRAME HPC training
    "wandb>=0.16.0",
    "optuna>=3.5.0",
    "hmmlearn>=0.3.0",
    "xgboost>=2.0.0",
    "pyspark>=3.5.0",  # Distributed processing
]
# CPU-only variant for systems without GPU
cpu = [
    # This group modifies torch to use CPU-only version
    # Install with: pip install -e .[cpu] --find-links https://download.pytorch.org/whl/torch_stable.html
    # Note: Manually override torch with: torch==2.0.0+cpu
]

[project.scripts]
sentiment-api = "sentiment_detector.main:run"
collect-data = "sentiment_detector.cli.collect:main"
backtest = "sentiment_detector.cli.backtest:main"

[project.urls]
Homepage = "https://github.com/jonx0037/sentiment-regime-detector"
Documentation = "https://github.com/jonx0037/sentiment-regime-detector#readme"
Repository = "https://github.com/jonx0037/sentiment-regime-detector.git"

[tool.hatch.build.targets.wheel]
packages = ["src/sentiment_detector"]

[tool.ruff]
target-version = "py312"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.isort]
known-first-party = ["sentiment_detector"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "praw.*",
    "yfinance.*",
    "transformers.*",
    "torch.*",
    "sklearn.*",
    "hmmlearn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=sentiment_detector --cov-report=term-missing"

[tool.coverage.run]
source = ["src/sentiment_detector"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
